services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: video-store-app
    container_name: video-store_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      # Descomente se tiver o certificado da empresa em ./certs/corp-ca.crt
      # - ./certs/corp-ca.crt:/usr/local/share/ca-certificates/corp-ca.crt:ro
    # environment:
    #   SSL_CERT_FILE: /usr/local/share/ca-certificates/corp-ca.crt
    depends_on:
      db:
        condition: service_healthy
    networks:
      - video-store-network
    command: sh -c "git config --global --add safe.directory /var/www && composer install --no-interaction --no-progress && php artisan serve --host=0.0.0.0 --port=8000"

  scheduler:
    image: video-store-app
    container_name: video-store_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - app
      - db
    networks:
      - video-store-network
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 3; done && php artisan schedule:work"

  vite:
    image: node:22-alpine
    container_name: video-store_vite
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - video-store-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  db:
    image: mysql:8.0
    container_name: video-store_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - video-store-network

networks:
  video-store-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  node_modules:
    driver: local