services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-store-app
    container_name: video-store_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - video-store-network
    command: sh -c "composer install --no-interaction --no-progress && php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: video-store-app
    container_name: video-store_vite
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      # node_modules fica num volume nomeado: sempre binários Linux,
      # independente do que existir no host
      - node_modules:/var/www/node_modules
    networks:
      - video-store-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  db:
    image: mysql:8.0
    container_name: video-store_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}   # NÃO pode ser "root"
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - video-store-network

networks:
  video-store-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  node_modules:
    driver: local